name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd packages/cli
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build
        run: |
          pnpm -r build
          pnpm --filter podium-cli build

      - name: Verify bundle is self-contained
        run: |
          # Match real import/require statements (not the embedded package.json metadata).
          if grep -nE 'from ?"@podium/|require\("@podium/|import\("@podium/' packages/cli/dist/index.js; then
            echo "Bundle still imports @podium/* — not self-contained" && exit 1
          fi
          echo "Bundle is self-contained."

      - name: Pack and publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd packages/cli
          # Pack the exact tarball we publish, then publish THAT file. Hashing the
          # local artifact (next step) avoids waiting on npm CDN propagation, and
          # since we upload these exact bytes the sha256 matches what brew fetches.
          npm pack
          npm publish "podium-cli-${VERSION}.tgz"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Bump Homebrew formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://registry.npmjs.org/podium-cli/-/podium-cli-${VERSION}.tgz"
          SHA=$(shasum -a 256 "packages/cli/podium-cli-${VERSION}.tgz" | awk '{print $1}')
          if [ -z "$SHA" ]; then echo "::error::no packed tarball to hash" && exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Re-apply edits on top of the freshest main so a moved-on main can't reject
          # the push (this step ran from a detached tag checkout previously and raced).
          git fetch origin main
          git checkout -B main origin/main
          sed -i "s|url \".*\"|url \"${URL}\"|" Formula/podium.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA}\"|" Formula/podium.rb
          (cd packages/cli && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          git add Formula/podium.rb packages/cli/package.json
          git commit -m "release: podium ${VERSION} (bump formula)" || { echo "nothing to commit"; exit 0; }
          for i in $(seq 1 5); do
            git push origin main && break || { git fetch origin main && git rebase origin/main; sleep 3; }
          done
